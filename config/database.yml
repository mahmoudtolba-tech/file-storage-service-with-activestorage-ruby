default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "filestorage_development" } %>

test:
  <<: *default
  database: filestorage_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "filestorage_production" } %>
  # In production you may want to use DATABASE_URL instead
  url: <%= ENV["DATABASE_URL"] %>